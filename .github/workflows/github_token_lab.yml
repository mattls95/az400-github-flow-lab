name: GITHUB_TOKEN LAB

on: workflow_dispatch

permissions: 
  contents: read
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Create issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "GITHUB_TOKEN lab" --body "Created by GitHub Actions"
